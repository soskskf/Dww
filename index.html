<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacked by Abyssic</title>
    <style>
        /* Estilo general oscuro y amenazante */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            color: #00ff41;
            text-shadow: 0 0 10px #00ff41;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: #111;
            padding: 50px 40px;
            border: 2px solid #00ff41;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.3);
            max-width: 600px;
            width: 100%;
        }

        /* Texto principal con efecto glitch */
        .hacked-text {
            font-size: 4rem;
            font-weight: bold;
            letter-spacing: 6px;
            text-transform: uppercase;
            animation: glitch 1.5s infinite;
            margin-bottom: 10px;
        }

        .subtext {
            font-size: 1.2rem;
            color: #00cc33;
            margin-bottom: 30px;
            opacity: 0.8;
            letter-spacing: 2px;
        }

        @keyframes glitch {
            0% { text-shadow: 2px 0 red, -2px 0 blue; }
            25% { text-shadow: -2px 0 red, 2px 0 blue; }
            50% { text-shadow: 2px 2px red, -2px -2px blue; }
            75% { text-shadow: -2px 2px red, 2px -2px blue; }
            100% { text-shadow: 2px 0 red, -2px 0 blue; }
        }

        /* Reproductor */
        .player {
            margin-top: 20px;
        }

        .player input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            background: #1a1a1a;
            border: 1px solid #00ff41;
            border-radius: 6px;
            color: #00ff41;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: 0.3s;
        }

        .player input[type="text"]:focus {
            border-color: #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.4);
        }

        .player input[type="text"]::placeholder {
            color: #006622;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .controls button {
            background: transparent;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 10px 25px;
            font-size: 1.1rem;
            font-family: inherit;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .controls button:hover {
            background: #00ff41;
            color: #0a0a0a;
            box-shadow: 0 0 30px #00ff41;
        }

        .controls button:active {
            transform: scale(0.95);
        }

        .status {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #00cc33;
            min-height: 1.5em;
        }

        /* Responsive */
        @media (max-width: 500px) {
            .hacked-text {
                font-size: 2.5rem;
            }
            .container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Texto principal -->
        <div class="hacked-text">Hacked by Abyssic</div>
        <div class="subtext">// system compromised //</div>

        <!-- Reproductor de audio -->
        <div class="player">
            <input type="text" id="audioUrl" placeholder="Pega aquí el enlace del audio (MP3, WAV, OGG...)" value="https://files.catbox.moe/pnkxoi.mp3">
            <div class="controls">
                <button id="playBtn">▶ Reproducir</button>
                <button id="pauseBtn">⏸ Pausa</button>
                <button id="stopBtn">⏹ Detener</button>
            </div>
            <div id="status" class="status">Listo para reproducir</div>
        </div>
    </div>

    <script>
        (function() {
            const audio = new Audio();
            const urlInput = document.getElementById('audioUrl');
            const statusDiv = document.getElementById('status');
            const playBtn = document.getElementById('playBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const stopBtn = document.getElementById('stopBtn');

            // Cargar y reproducir
            function loadAndPlay(url) {
                if (!url || url.trim() === '') {
                    statusDiv.textContent = '⚠️ Ingresa una URL válida';
                    return false;
                }
                // Si el audio ya tiene una fuente diferente, la cambiamos
                if (audio.src !== url) {
                    audio.src = url;
                    audio.load();
                }
                audio.play()
                    .then(() => {
                        statusDiv.textContent = '▶ Reproduciendo...';
                    })
                    .catch(err => {
                        statusDiv.textContent = '❌ Error al reproducir: ' + err.message;
                    });
                return true;
            }

            // Evento para cuando termina la reproducción
            audio.addEventListener('ended', () => {
                statusDiv.textContent = '⏹ Reproducción finalizada';
            });

            // Evento para errores de carga
            audio.addEventListener('error', (e) => {
                statusDiv.textContent = '❌ Error al cargar el audio. Verifica la URL.';
            });

            // Botón reproducir
            playBtn.addEventListener('click', () => {
                const url = urlInput.value.trim();
                if (url) {
                    loadAndPlay(url);
                } else {
                    statusDiv.textContent = '⚠️ No has pegado ningún enlace';
                }
            });

            // Botón pausa
            pauseBtn.addEventListener('click', () => {
                if (!audio.paused) {
                    audio.pause();
                    statusDiv.textContent = '⏸ Pausado';
                } else {
                    statusDiv.textContent = '⚠️ No hay audio reproduciéndose';
                }
            });

            // Botón detener (para y vuelve al inicio)
            stopBtn.addEventListener('click', () => {
                audio.pause();
                audio.currentTime = 0;
                statusDiv.textContent = '⏹ Detenido';
            });

            // También se puede reproducir al presionar Enter en el input
            urlInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    playBtn.click();
                }
            });

            // Cargar un audio de ejemplo al iniciar (si el input tiene valor)
            window.addEventListener('load', () => {
                const initialUrl = urlInput.value.trim();
                if (initialUrl) {
                    // Pre-cargamos pero no reproducimos automáticamente
                    audio.src = initialUrl;
                    audio.load();
                    statusDiv.textContent = '🔊 Audio cargado. Presiona "Reproducir".';
                }
            });
        })();
    </script>

</body>
</html>
