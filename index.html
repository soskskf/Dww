<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hacked by Abyssic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            color: #00ff41;
            text-shadow: 0 0 10px #00ff41;
            cursor: pointer;
            user-select: none;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        .hacked-text {
            font-size: 5rem;
            font-weight: bold;
            letter-spacing: 8px;
            text-transform: uppercase;
            animation: glitch 1.5s infinite;
            line-height: 1.2;
        }

        .subtext {
            font-size: 1.2rem;
            color: #00cc33;
            margin-top: 15px;
            opacity: 0.7;
            letter-spacing: 3px;
            animation: pulse 2s infinite;
        }

        @keyframes glitch {
            0% { text-shadow: 3px 0 red, -3px 0 blue; }
            25% { text-shadow: -3px 0 red, 3px 0 blue; }
            50% { text-shadow: 3px 3px red, -3px -3px blue; }
            75% { text-shadow: -3px 3px red, 3px -3px blue; }
            100% { text-shadow: 3px 0 red, -3px 0 blue; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .status {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #006622;
            letter-spacing: 1px;
            transition: 0.5s;
        }

        .status.active {
            color: #00ff41;
        }

        @media (max-width: 600px) {
            .hacked-text {
                font-size: 2.8rem;
                letter-spacing: 4px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="hacked-text">Hacked by Abyssic</div>
        <div class="subtext">// system compromised //</div>
        <div id="status" class="status">🔊 Haz clic en la pantalla para activar el sonido</div>
    </div>

    <script>
        (function() {
            const statusDiv = document.getElementById('status');
            const audio = new Audio();
            const AUDIO_URL = "https://files.catbox.moe/pnkxoi.mp3";

            let played = false;

            // Precargar el audio
            audio.src = AUDIO_URL;
            audio.load();

            function playAudio() {
                if (played) return;
                audio.play()
                    .then(() => {
                        played = true;
                        statusDiv.textContent = '▶ Sonido activo';
                        statusDiv.classList.add('active');
                    })
                    .catch(err => {
                        statusDiv.textContent = '❌ Error: ' + err.message;
                    });
            }

            // Al hacer clic en cualquier parte, reproduce
            document.addEventListener('click', playAudio);

            // También al tocar en móviles
            document.addEventListener('touchstart', playAudio);

            // Si el audio termina, lo reiniciamos para que suene en bucle
            audio.addEventListener('ended', () => {
                audio.currentTime = 0;
                audio.play().catch(() => {});
            });

            // Mensaje inicial
            statusDiv.textContent = '🔊 Haz clic en la pantalla para activar el sonido';
        })();
    </script>

</body>
</html>
